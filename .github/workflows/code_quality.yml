name: Code quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.10
      - name: Run Biome
        run: biome ci .
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate and build
        run: bun run build
